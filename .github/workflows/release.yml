name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to release, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  BINARY_NAME: waves
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: "false"
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - run: cargo package --list

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            if cargo build --release --locked; then
              exit 0
            fi
            echo "cargo build failed on attempt ${attempt}; retrying..." >&2
            sleep "$((attempt * 10))"
          done

          cargo build --release --locked
      - name: Package release binary
        shell: bash
        run: |
          set -euo pipefail

          arch="$(uname -m)"
          asset="${BINARY_NAME}-${{ matrix.platform }}-${arch}"

          mkdir -p dist
          cp "target/release/${BINARY_NAME}" "dist/${asset}"
          chmod +x "dist/${asset}"

          (
            cd dist
            if command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "${asset}" > "${asset}.sha256"
            else
              sha256sum "${asset}" > "${asset}.sha256"
            fi
          )
      - uses: actions/upload-artifact@v6
        with:
          name: release-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mapfile -t assets < <(find dist -type f | sort)
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo "no release assets found" >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${assets[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${assets[@]}" \
              --title "${RELEASE_TAG}" \
              --generate-notes \
              --verify-tag
          fi
