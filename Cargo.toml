[package]
name = "waves"
version = "0.1.2"
edition = "2024"
description = "A TUI + MCP real-time game framework for external AI agents"
repository = "https://github.com/EricsmOOn/waves"
license = "MIT"
keywords = ["mcp", "tui", "game", "agent", "simulation"]
categories = ["games", "command-line-utilities"]
readme = "README.md"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
crossterm = "0.28"
rand = "0.8"
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "serde"] }
toml = "0.8"
unicode-segmentation = "1"
unicode-width = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
